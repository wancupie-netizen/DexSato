[pytest]
testpaths = tests

python_files =
    test_founder_*.py
    test_app_bootstrap.py
    test_production_security.py
    test_production_dependencies.py
    test_discovery_storage.py
    test_production_readiness.py
    test_collector_packaging.py
    test_jupiter_swap_service.py
    test_jupiter_quote_service.py
    test_jupiter_fee_policy.py
    test_jupiter_referral_verification.py
    test_dexsato_solana_discovery_token_presenter.py
    test_solana_discovery_qualification.py
    test_solana_discovery_feed_service.py
    test_solana_discovery_token_service.py
    test_telegram_notifier.py
    test_commodity_*.py
    test_gold_*.py
    test_risk_note.py
    test_twelve_data.py

python_functions = test_*

addopts =
    -ra
    --strict-markers

norecursedirs =
    .git
    .pytest_cache
    __pycache__
    output
    adaptive
    validation
