[pytest]
testpaths = tests

python_files =
    test_founder_*.py
    test_app_bootstrap.py
    test_telegram_notifier.py
    test_commodity_*.py
    test_gold_*.py
    test_twelve_data.py

python_functions = test_*

addopts =
    -ra
    --strict-markers

norecursedirs =
    .git
    .pytest_cache
    __pycache__
    output
    adaptive
    validation
